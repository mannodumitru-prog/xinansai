<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecKeeper - 信创生态主机安全巡检平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-deep:    #050d1a;
            --bg-panel:   #0b1628;
            --bg-card:    #0f1e35;
            --bg-card-alt:#111f38;
            --border:     rgba(0, 170, 255, 0.15);
            --border-glow:rgba(0, 200, 255, 0.35);
            --accent:     #00c8ff;
            --accent2:    #0077ff;
            --accent-dim: rgba(0,200,255,0.08);
            --text-pri:   #e0eeff;
            --text-sec:   #7a9cc5;
            --text-muted: #3d5a7a;
            --danger:     #ff4d6a;
            --warning:    #f5a623;
            --safe:       #00d68f;
            --nav-bg:     #080f1d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: linear-gradient(135deg, #020818 0%, #0a1628 50%, #050d20 100%);
            min-height: 100vh;
            padding: 24px;
            color: var(--text-pri);
            font-size: 1.05em; /* 全局字体整体放大 */
        }
        /* ─── Container ─── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-panel);
            border-radius: 16px;
            box-shadow: 0 0 0 1px var(--border), 0 20px 60px rgba(0,0,0.6), 0 0 80px rgba(0,100,200,0.08);
            overflow: hidden;
        }
        /* ─── Header ─── */
        .header {
            background: linear-gradient(180deg, #040c1a 0%, #071220 100%);
            border-bottom: 1px solid var(--border);
            padding: 36px 40px 28px;
            display: flex;
            align-items: center;
            gap: 28px;
            position: relative;
            overflow: hidden;
        }
        /* subtle animated grid in header */
        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        /* top accent line */
        .header::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
        }
        /* ─── Shield SVG wrapper ─── */
        .shield-wrap {
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }
        .shield-wrap svg {
            filter: drop-shadow(0 0 14px rgba(0,200,255,0.55)) drop-shadow(0 0 30px rgba(0,100,255,0.3));
            animation: shieldPulse 3s ease-in-out infinite;
        }
        @keyframes shieldPulse {
            0%,100% { filter: drop-shadow(0 0 10px rgba(0,200,255,0.5)) drop-shadow(0 0 24px rgba(0,100,255,0.25)); }
            50%      { filter: drop-shadow(0 0 20px rgba(0,220,255,0.8)) drop-shadow(0 0 40px rgba(0,130,255,0.4)); }
        }
        .header-text { flex: 1; position: relative; z-index: 1; }
        .header-text h1 {
            font-size: 2em;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .header-text h1 span { color: var(--accent); }
        .header-text p {
            font-size: 1em; /* 放大副标题 */
            color: var(--text-sec);
            letter-spacing: 0.08em;
        }
        /* ─── Rule-update box 改版：单行居中，弱化视觉 ─── */
        .rule-update-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: row; /* 改为一行 */
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0,200,255,0.04); /* 降低背景透明度，不抢眼 */
            border: 1px solid rgba(0,170,255,0.12);
            border-radius: 8px;
            padding: 8px 14px;
            min-width: 160px;
            flex-shrink: 0;
        }
        .rule-status {
            font-size: 13px; /* 字号放大 */
            color: var(--text-sec);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .rule-status-icon {
            width: 16px; height: 16px;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--accent);
        }
        #rule-version {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: var(--accent);
            margin-left: 4px;
        }
        .update-btn {
            background: linear-gradient(135deg, rgba(0,120,255,0.22), rgba(0,200,255,0.12));
            color: var(--accent);
            border: 1px solid rgba(0,200,255,0.25);
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .update-btn:hover {
            background: linear-gradient(135deg, rgba(0,140,255,0.4), rgba(0,200,255,0.25));
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0,200,255,0.2);
        }
        .update-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        /* ─── Navigation ─── */
        .nav {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            justify-content: stretch;
            gap: 0;
        }
        .nav-button {
            flex: 1;
            background: transparent;
            color: var(--text-sec);
            border: none;
            border-bottom: 2px solid transparent;
            padding: 16px 10px;
            cursor: pointer;
            font-size: 15px; /* 导航字体放大 */
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.04em;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .nav-button .nav-icon {
            width: 18px; height: 18px;
            opacity: 0.7;
            transition: opacity 0.25s;
        }
        .nav-button:hover {
            color: var(--text-pri);
            background: rgba(0,200,255,0.04);
        }
        .nav-button:hover .nav-icon { opacity: 1; }
        .active-nav {
            color: var(--accent) !important;
            border-bottom-color: var(--accent) !important;
            background: rgba(0,200,255,0.06) !important;
        }
        .active-nav .nav-icon { opacity: 1; }
        /* ─── Content ─── */
        .content { padding: 28px; min-height: 500px; background: var(--bg-panel); }
        /* ─── Cards ─── */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-bottom: 20px; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 22px 24px;
            transition: all 0.3s;
        }
        .card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 0 20px rgba(0,200,255,0.08);
            transform: translateY(-3px);
        }
        .card h3 {
            color: var(--text-pri);
            margin-bottom: 14px;
            font-size: 1.1em; /* 卡片标题放大 */
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .card h3 svg { color: var(--accent); flex-shrink: 0; }
        .card p { font-size: 14px; /* 卡片小字放大 */
            color: var(--text-sec); }
        .stat-number {
            font-size: 2.8em; /* 数字放大 */
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            margin: 14px 0 8px;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 20px rgba(0,200,255,0.4);
        }
        /* ─── Charts ─── */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
        /* 图表容器纯黑改柔和深蓝，不压抑 */
        .chart-container {
            background: #0a1526;
            border-radius: 10px;
            padding: 14px;
            border: 1px solid var(--border);
        }
        .chart-title { text-align: center; margin-top: 8px; font-weight: 600; font-size: 14px; color: var(--text-sec); letter-spacing: 0.05em; }
        /* ─── Status grid ─── */
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 14px; }
        .status-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: #0a1526; /* 状态面板同步淡深色 */
            border-radius: 8px;
            border-left: 3px solid var(--accent2);
        }
        .status-item.normal  { border-left-color: var(--safe); }
        .status-item.warning { border-left-color: var(--warning); }
        .status-item.danger  { border-left-color: var(--danger); }
        .status-icon { font-size: 22px; margin-right: 14px; min-width: 22px; text-align: center; }
        .status-item.normal  .status-icon { color: var(--safe); }
        .status-item.warning .status-icon { color: var(--warning); }
        .status-item.danger  .status-icon { color: var(--danger); }
        .status-label { font-size: 12px; color: var(--text-muted); margin-bottom: 3px; letter-spacing: 0.04em; }
        .status-value { font-size: 18px; font-weight: 700; color: var(--text-pri); }
        /* ─── Buttons 改版：统一青蓝科技渐变，移除红绿 ─── */
        .button-group { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin: 28px 0 8px; }
        .scan-button {
            background: linear-gradient(135deg, #005fb8, #00b8e6);
            color: white;
            border: none;
            padding: 15px 36px;
            font-size: 1.05em;
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 0.06em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0,180,230,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }
        .scan-button:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(0,180,230,0.5); }
        .scan-button:disabled { background: var(--text-muted); box-shadow: none; cursor: not-allowed; transform: none; }
        .report-button {
            background: linear-gradient(135deg, #0068a8, #00c0e8) !important;
            box-shadow: 0 4px 20px rgba(0,190,240,0.3) !important;
        }
        .report-button:hover { box-shadow: 0 6px 28px rgba(0,190,240,0.5) !important; transform: translateY(-2px); }
        /* ─── Tables ─── */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        .data-table th {
            background: #0a1526;
            color: var(--text-sec);
            padding: 11px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }
        .data-table td { padding: 10px 14px; border-bottom: 1px solid rgba(0,200,255,0.05); font-size: 15px; color: var(--text-pri); }
        .data-table tr:hover td { background: rgba(0,200,255,0.04); }
        .status-indicator { padding: 3px 9px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
        .status-safe    { background: var(--safe); }
        .status-warning { background: var(--warning); }
        .status-danger  { background: var(--danger); }
        /* ─── System info ─── */
        .system-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
        .system-info-item {
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-pri);
            font-size: 15px;
        }
        .system-info-item i { color: var(--accent); width: 16px; }
        /* ─── Vuln filters ─── */
        .vuln-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filter-btn {
            padding: 9px 20px;
            border: 1px solid var(--border-glow);
            background: var(--bg-card);
            color: var(--text-sec);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, rgba(0,120,255,0.2), rgba(0,200,255,0.1));
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0,200,255,0.15);
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0,200,255,0.06);
        }
        .verified-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--danger);
            font-weight: 600;
            font-size: 14px;
            background: rgba(255,77,106,0.08);
            padding: 9px 18px;
            border-radius: 6px;
            border: 1px solid rgba(255,77,106,0.25);
            transition: all 0.25s;
        }
        .verified-toggle:hover { background: rgba(255,77,106,0.14); border-color: var(--danger); }
        /* ─── Misc ─── */
        .hidden { display: none !important; }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .loading-spinner { animation: spin 1s linear infinite; }
        .fas, .far, .fab { margin-right: 0; width: auto; }
        /* 历史扫描横幅 全新深蓝科技样式，去除刺眼黄色 */
        #history-banner {
            background: linear-gradient(90deg, rgba(0,60,110,0.85), rgba(0,100,170,0.7), rgba(0,60,110,0.85));
            color: #e0eeff;
            padding: 12px 24px;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
            animation: slideIn 0.5s;
            border-bottom: 1px solid rgba(0,200,255,0.2);
        }
        #history-banner strong {
            color: var(--accent);
        }
        /* ─── Footer ─── */
        .footer {
            background: #0a1526;
            border-top: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .footer-shield {
            opacity: 0.5;
        }
        .footer-text {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            font-weight: 500;
        }
        .footer-text span { color: var(--accent); opacity: 0.7; }
        /* ─── Blank placeholder ─── */
        #blank-placeholder h2 { color: var(--text-sec); font-size: 1.4em; }
        #blank-placeholder p  { color: var(--text-muted); font-size: 15px; }
        @keyframes spin     { from { transform: rotate(0deg); }       to { transform: rotate(360deg); } }
        @keyframes slideIn  { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (max-width: 768px) {
            .header { flex-wrap: wrap; padding: 24px 20px 20px; }
            .rule-update-container { width: 100%; flex-direction: column; align-items: stretch; gap:10px; }
            .charts-grid, .system-info-grid { grid-template-columns: 1fr; }
            .nav { padding: 0; }
            .nav-button { padding: 14px 6px; font-size: 12px; }
            .header-text h1 { font-size: 1.5em; }
            .button-group { flex-direction: column; align-items: center; }
            .scan-button { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ═══ HEADER ═══ -->
        <div class="header">
            <!-- SVG Shield -->
            <div class="shield-wrap">
                <svg width="76" height="88" viewBox="0 0 76 88" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- outer shield body -->
                    <path d="M38 4L8 16V42C8 60 21 74.5 38 82C55 74.5 68 60 68 42V16L38 4Z"
                          fill="url(#shieldGrad)" stroke="url(#strokeGrad)" stroke-width="1.5" />
                    <!-- inner shield glow layer -->
                    <path d="M38 11L14 21V42C14 57 25.5 69.5 38 76C50.5 69.5 62 57 62 42V21L38 11Z"
                          fill="url(#innerGrad)" opacity="0.4" />
                    <!-- circuit lines -->
                    <line x1="26" y1="38" x2="50" y2="38" stroke="#00c8ff" stroke-width="1" opacity="0.4" />
                    <line x1="38" y1="28" x2="38" y2="52" stroke="#00c8ff" stroke-width="1" opacity="0.4" />
                    <!-- lock body -->
                    <rect x="28" y="41" width="20" height="16" rx="3" fill="none" stroke="url(#lockStroke)" stroke-width="1.8" />
                    <!-- lock shackle -->
                    <path d="M31 41V36.5C31 32.4 45 32.4 45 36.5V41" fill="none" stroke="url(#lockStroke)" stroke-width="1.8" stroke-linecap="round" />
                    <!-- lock keyhole -->
                    <circle cx="38" cy="49" r="2.5" fill="#00c8ff" opacity="0.9" />
                    <rect x="37" y="49" width="2" height="4" rx="1" fill="#00c8ff" opacity="0.9" />
                    <!-- corner dots -->
                    <circle cx="26" cy="38" r="2" fill="#00c8ff" opacity="0.7" />
                    <circle cx="50" cy="38" r="2" fill="#00c8ff" opacity="0.7" />
                    <circle cx="38" cy="28" r="2" fill="#00c8ff" opacity="0.7" />
                    <circle cx="38" cy="52" r="2" fill="#00c8ff" opacity="0.7" />
                    <defs>
                        <linearGradient id="shieldGrad" x1="38" y1="4" x2="38" y2="82" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#0d2a4a" />
                            <stop offset="100%" stop-color="#050d1a" />
                        </linearGradient>
                        <linearGradient id="strokeGrad" x1="8" y1="4" x2="68" y2="82" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#00c8ff" />
                            <stop offset="100%" stop-color="#0055ff" />
                        </linearGradient>
                        <linearGradient id="innerGrad" x1="38" y1="11" x2="38" y2="76" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#00c8ff" stop-opacity="0.3" />
                            <stop offset="100%" stop-color="#0040cc" stop-opacity="0.05" />
                        </linearGradient>
                        <linearGradient id="lockStroke" x1="28" y1="32" x2="50" y2="57" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#80e0ff" />
                            <stop offset="100%" stop-color="#00a0e0" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <!-- Title + subtitle -->
            <div class="header-text">
                <h1><span>SecKeeper</span> &nbsp;信创生态主机安全巡检平台</h1>
                <p>全面守护信创系统安全与合规 · 实时威胁感知 · 自动化安全基线检测</p>
            </div>
            <!-- Rule update — top-right corner 已改为单行居中 -->
            <div class="rule-update-container">
                <div class="rule-status">
                    <!-- tiny db icon inline SVG -->
                    <svg class="rule-status-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                        <ellipse cx="8" cy="4" rx="6" ry="2.2" />
                        <path d="M2 4v4c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2V4" />
                        <path d="M2 8v4c0 1.2 2.7 2.2 6 2.2s6-1 6-2.2V8" />
                    </svg>
                    规则库&nbsp;
                    <span id="rule-version">获取中...</span>
                </div>
                <button id="update-rules-btn" class="update-btn">
                    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M3 8a5 5 0 1 0 1-3" stroke-linecap="round" />
                        <polyline points="1,3 3,8 8,6" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    检查更新
                </button>
            </div>
        </div>
        <!-- ═══ NAV ═══ -->
        <div class="nav">
            <button class="nav-button active-nav" data-tab="dashboard">
                <!-- radar / overview icon -->
                <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <circle cx="10" cy="10" r="8" />
                    <circle cx="10" cy="10" r="4" />
                    <line x1="10" y1="2" x2="10" y2="6" />
                    <line x1="10" y1="14" x2="10" y2="18" />
                    <line x1="2" y1="10" x2="6" y2="10" />
                    <line x1="14" y1="10" x2="18" y2="10" />
                </svg>
                安全概览
            </button>
            <button class="nav-button" data-tab="assets">
                <!-- server/asset icon -->
                <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="2" y="3" width="16" height="5" rx="1.5" />
                    <rect x="2" y="12" width="16" height="5" rx="1.5" />
                    <circle cx="15" cy="5.5" r="1" fill="currentColor" />
                    <circle cx="15" cy="14.5" r="1" fill="currentColor" />
                </svg>
                资产清点
            </button>
            <button class="nav-button" data-tab="compliance">
                <!-- checkmark/compliance icon -->
                <svg class="nav-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M10 2L3 5v5c0 4.4 3 8 7 9 4-1 7-4.6 7-9V5l-7-3z" />
                    <polyline points="7,10 9,12 13,8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                合规检查
            </button>
            <button class="nav-button" data-tab="vulnerabilities">
                <!-- bug/vuln icon -->

    <script src="js/echarts.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // 覆盖图表配置：文字强制纯白加粗，解决看不清问题
        const originalInitVuln = window.secKeeperApp?.initVulnerabilityChart;
        const originalInitComp = window.secKeeperApp?.initComplianceChart;
        if(window.secKeeperApp) {
            window.secKeeperApp.initVulnerabilityChart = function(){
                const el = document.getElementById('vulnPieChart');
                if (!el) return;
                const vulns = this.currentData.vulnerabilities?.details || this.currentData.vulnerabilities?.vulnerabilities || [];
                let counts = { critical: 0, high: 0, medium: 0, low: 0 };
                vulns.forEach(v => {
                    const s = (v.severity || 'low').toLowerCase();
                    if(counts[s] !== undefined) counts[s]++;
                });
                this.charts.vuln = echarts.init(el);
                this.charts.vuln.setOption({
                    tooltip: { trigger: 'item', textStyle:{color:'#fff',fontSize:14} },
                    legend: {
                        textStyle:{color:'#ffffff',fontSize:14,fontWeight:bold},
                        bottom:10
                    },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        label:{
                            show:true,
                            color:'#ffffff',
                            fontSize:14,
                            fontWeight:'bold'
                        },
                        data: [
                            { value: counts.critical, name: '严重', itemStyle: { color: '#c01020' } },
                            { value: counts.high, name: '高危', itemStyle: { color: '#ff4d6a' } },
                            { value: counts.medium, name: '中危', itemStyle: { color: '#f5a623' } },
                            { value: counts.low, name: '低危', itemStyle: { color: '#f9d048' } }
                        ]
                    }]
                });
            }
            window.secKeeperApp.initComplianceChart = function(){
                const el = document.getElementById('complianceChart');
                if (!el) return;
                const summary = this.currentData.compliance?.summary || { passed: 0, total: 0 };
                const failed = Math.max(0, (summary.total || 0) - (summary.passed || 0));
                this.charts.comp = echarts.init(el);
                this.charts.comp.setOption({
                    tooltip: { trigger: 'item', textStyle:{color:'#fff',fontSize:14} },
                    legend: {
                        textStyle:{color:'#ffffff',fontSize:14,fontWeight:bold},
                        bottom:10
                    },
                    series: [{
                        type: 'pie',
                        radius: ['40%', '70%'],
                        label:{
                            show:true,
                            color:'#ffffff',
                            fontSize:14,
                            fontWeight:'bold'
                        },
                        data: [
                            { value: summary.passed || 0, name: '通过', itemStyle: { color: '#00d68f' } },
                            { value: failed, name: '未通过', itemStyle: { color: '#ff4d6a' } }
                        ]
                    }]
                });
            }
        }
    </script>
